[project]
name = "ccobsr"
version = "0.2.1"
description = "Claude Code Obsidian Research CLI — binary-safe client for the Obsidian Local REST API, shaped for Karpathy-style LLM research wikis"
authors = [{ name = "mknt", email = "shane.cousins@gmail.com" }]
readme = "README.md"
keywords = ['python', 'obsidian', 'claude-code', 'research']
requires-python = ">=3.14,<3.15"
classifiers = [
    "Intended Audience :: Developers",
    "Private :: Do Not Upload",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

dependencies = []

[project.scripts]
ccobsr = "ccobsr.cli:main"

[project.urls]
Repository = "https://github.com/monkut/ccobsr-research-cli"

[dependency-groups]
dev = [
    "pyright>=1.1.396",
    "ruff>=0.9.10",
    "pytest>=8.3.5",
    "poethepoet>=0.34.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ccobsr*"]
exclude = []

[tool.setuptools.package-data]
ccobsr = ["skills/**/*"]

[tool.poe.tasks]
check = "uv run ruff check"
typecheck = "uv run pyright"

[tool.poe.tasks.test]
shell = "mkdir test-reports || true && uv run pytest -v tests/ --junitxml=test-reports/junit.xml"

[tool.pyright]
include = ["ccobsr"]
exclude = ["**/.venv", "tmp/", "**/__pycache__", "**/*.pyc", "tests/"]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = 1

[tool.ruff]
line-length = 120
indent-width = 4
target-version = 'py314'
exclude = [".git", ".venv", "**/node_modules/"]
fix = true
respect-gitignore = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["ALL"]
extend-per-file-ignores = { "**/__init__.py" = ["I", "F403"], "tests/**" = ["PLR2004"] }
extend-safe-fixes = [
    "D200",
    "ANN204",
]
ignore = [
    "A005",
    "ANN002",
    "ANN003",
    "ANN201",
    "ARG002",
    "ARG003",
    "C401",
    "COM812",
    "COM819",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D205",
    "D206",
    "D213",
    "D300",
    "D400",
    "D401",
    "D415",
    "DTZ005",
    "E111",
    "E114",
    "E117",
    "EM101",
    "EM102",
    "ERA001",
    "EXE002",
    "FBT",
    "FIX002",
    "G004",
    "INP001",
    "ISC001",
    "ISC002",
    "PERF401",
    "PLR0913",
    "PT009",
    "PT011",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "RET504",
    "RUF",
    "S101",
    "SIM108",
    "SIM118",
    "SLF001",
    "TC001",
    "TC002",
    "TC003",
    "TD002",
    "TD003",
    "TID252",
    "TRY003",
]

[tool.ruff.lint.mccabe]
max-complexity = 13

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
